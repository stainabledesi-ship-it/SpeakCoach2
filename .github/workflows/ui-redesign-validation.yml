name: UI redesign validation

on:
  push:
    branches:
      - redesign/declutter-ui
  pull_request:
    branches:
      - feature/shadowing-fixes-and-ui-cleanup

permissions:
  contents: read

jobs:
  tests:
    name: Unit and accessibility tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit and contrast tests
        run: npm test

  build:
    name: Production web build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production web app
        run: npm run build
